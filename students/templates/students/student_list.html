<!DOCTYPE html>
<html>
<head>
    <title>Student List</title>
</head>
<body>

    <h1>Student List</h1>

    <a href="{% url 'student_create' %}">
        Add New Student
    </a>

    <br><br>

    <table border="1" cellpadding="10">
        <tr>
            <th>ID</th>
            <th>Name</th>
            <th>Roll No</th>
            <th>Email</th>
            <th>Course</th>
            <th>Age</th>
            <th>Actions</th>
        </tr>

        {% for student in students %}
        <tr>
            <td>{{ student.id }}</td>
            <td>{{ student.name }}</td>
            <td>{{ student.roll_no }}</td>
            <td>{{ student.email }}</td>
            <td>{{ student.course }}</td>
            <td>{{ student.age }}</td>

            <td>
                <a href="{% url 'student_detail' student.id %}">
                    View
                </a>

                |

                <a href="{% url 'student_update' student.id %}">
                    Edit
                </a>

                |

                <a href="{% url 'student_delete' student.id %}">
                    Delete
                </a>
            </td>
        </tr>

        {% empty %}
        <tr>
            <td colspan="7">
                No students available.
            </td>
        </tr>
        {% endfor %}

    </table>

</body>
</html>
