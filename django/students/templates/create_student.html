<!DOCTYPE html>
<html>
<head>
    <title>Add Student</title>
</head>
<body>

<h1>Add Student</h1>

<form method="POST">
    {% csrf_token %}

    <input type="text"
           name="name"
           placeholder="Name"
           required>

    <input type="number"
           name="age"
           placeholder="Age"
           required>

    <input type="text"
           name="course"
           placeholder="Course"
           required>

    <button type="submit">
        Create Student
    </button>
</form>

<br>

<a href="{% url 'student_list' %}">
    Back to Students
</a>

</body>
</html>
