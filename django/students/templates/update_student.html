<!DOCTYPE html>
<html>
<head>
    <title>Update Student</title>
</head>
<body>

<h1>Update Student</h1>

<form method="POST">

    {% csrf_token %}

    <input type="text"
           name="name"
           value="{{ student.name }}"
           required>

    <input type="number"
           name="age"
           value="{{ student.age }}"
           required>

    <input type="text"
           name="course"
           value="{{ student.course }}"
           required>

    <button type="submit">
        Update Student
    </button>

</form>

<br>

<a href="{% url 'student_list' %}">
    Back
</a>

</body>
</html>
